<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laser Line</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--line:#2a2a2a;--ink:#ececec;--dim:#8b8b8b;--bad:#c9604f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 36px}
h1{font:600 34px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.32em;margin:0;text-transform:uppercase}
.sub{color:var(--dim);margin:8px 0 22px;font-size:12px;letter-spacing:.06em}
.main{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.stage{flex:1 1 420px;min-width:0}
canvas{width:100%;aspect-ratio:1;display:block;border:1px solid var(--line);background:#0a0a0a}
.panel{flex:1 1 300px;max-width:430px;min-width:0}
.lv{color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
h2{font:600 28px/1.1 "Cormorant Garamond",Georgia,serif;margin:4px 0 8px}
.desc{color:#bdbdbd;margin:0 0 16px;min-height:88px}
.eq{font:500 26px/1 "IBM Plex Mono",monospace;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px;text-align:center}
.typed{display:flex;gap:8px;margin-bottom:12px}
.typed input{flex:1;min-width:0;background:#0f0f0f;border:1px solid #333;color:var(--ink);font:16px "IBM Plex Mono",monospace;padding:10px 12px;outline:none}
.typed input:focus{border-color:#888}
button{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid #3a3a3a;padding:10px 14px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:#1c1c1c;border-color:#777}
button:disabled{opacity:.35;cursor:default}
.fire{background:var(--ink);color:#0a0a0a;border-color:var(--ink)}
.fire:hover:not(:disabled){background:#fff;border-color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.msg{min-height:72px;margin:16px 0 8px;color:#cfcfcf}
.msg.bad{color:var(--bad)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{padding:6px 0;width:34px;text-align:center;letter-spacing:0}
.dots button.cur{border-color:var(--ink)}
.dots button.done{color:#fff}
.dots small{display:block;font-size:8px;line-height:1;color:var(--dim);letter-spacing:1px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Laser Line</h1>
  <p class="sub">No sliders. Read the coordinates, work out the equation, type it in and fire.</p>
  <div class="main">
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="panel">
      <div class="lv" id="lv"></div>
      <h2 id="ttl"></h2>
      <p class="desc" id="desc"></p>
      <div class="eq" id="eq"></div>
      <div class="typed"><input id="typed" placeholder="e.g. y = 2x + 1" autocomplete="off" spellcheck="false"></div>
      <div class="acts"><button class="fire" id="fire">Fire</button><button id="reset">Reset</button><button id="next">Next →</button></div>
      <div class="msg" id="msg"></div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</div>
<script>
const L=[
{t:"Flat Line",d:"Fired from the left edge. Type the horizontal line that passes through all three enemies: y = a number.",h:"y = ?",ok:["h"],n:"Only horizontal lines, y = a number, work here.",par:1,e:[[-6,3],[1,3],[7,3]],o:[]},
{t:"Straight Up",d:"Fired from the bottom edge. Type the vertical line through all three enemies: x = a number.",h:"x = ?",ok:["v"],n:"Only vertical lines, x = a number, work here.",par:1,e:[[3,-6],[3,0],[3,7]],o:[]},
{t:"The Origin",d:"Your laser is fixed at (0, 0) and fires both ways along your line. Any line through the origin has c = 0, so only the gradient is left to find.",s:[0,0],par:2,e:[[-4,-4],[3,3],[6,6],[-5,5],[4,-4]],o:[[-8,2,-6,4]]},
{t:"The Rooftop",d:"You stand at (0, 3) and fire up and down. Your line must pass through you, so c is fixed. A vertical line is allowed too.",s:[0,3],par:3,e:[[2,7],[-3,-3],[2,-3],[-2,9],[0,8],[0,-6]],o:[[4,-8,6,-5],[-8,5,-6,7]]},
{t:"Below Ground",d:"The laser sits at (0, −2). The intercept is fixed. Work out each gradient from a target and your position.",s:[0,-2],par:3,e:[[4,2],[-3,-5],[-3,4],[3,-8],[0,6]],o:[[5,-1,7,1],[-8,-4,-6,-2]]},
{t:"First Quadrant",d:"You are at (1, 5), off the y-axis, so c is no longer given. Find the gradient, then use your position to find c.",s:[1,5],par:3,e:[[3,9],[-2,-1],[6,0],[-3,9],[-6,5],[8,5]],o:[[4,6,6,8],[3,-5,5,-3]]},
{t:"Second Quadrant",d:"You are at (−3, 4). Gradients can be fractions: type 1/2 or 0.5.",s:[-3,4],par:3,e:[[-6,1],[2,9],[-5,8],[1,-4],[1,6],[-7,2]],o:[[3,-6,5,-4],[-2,-1,0,1]]},
{t:"Third Quadrant",d:"You are at (−4, −3). Watch the signs when you substitute.",s:[-4,-3],par:3,e:[[0,1],[-7,-6],[-6,-1],[2,-9],[-2,1],[-7,-9]],o:[[4,3,6,5],[3,-5,5,-3]]},
{t:"Fourth Quadrant",d:"You are at (5, −4). Three lines, six targets. Obstacles only block the beam on their own side.",s:[5,-4],par:3,e:[[2,-1],[8,-7],[7,0],[3,-8],[1,-2],[9,-6]],o:[[-6,2,-4,4],[-3,-9,-1,-7]]},
{t:"Crosswinds",d:"Fired from (−5, −2). Five lines hide among the targets, and one is horizontal and one is vertical.",s:[-5,-2],par:5,e:[[-1,2],[-8,-5],[-2,-5],[-8,1],[-4,1],[-6,-5],[-5,7],[-5,-8],[3,-2],[-9,-2]],o:[[4,-8,6,-6],[-9,4,-7,6]]},
{t:"Last Light",d:"From (4, 3). Five lines again. Stars depend on how few shots you use.",s:[4,3],par:5,e:[[6,5],[-2,-3],[1,6],[9,-2],[6,7],[0,-5],[8,5],[-4,-1],[4,-6],[4,9]],o:[[-8,4,-6,6],[7,-6,9,-4]]}
];
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),$=id=>document.getElementById(id);
const r=v=>Math.round(v*100)/100,sg=v=>(v<0?"−":"")+Math.abs(r(v));
const S={lv:0,mode:null,m:0,c:0,k:0,shots:0,E:[],beam:null,done:false,best:[]};
let dpr=1,U=30;
const pos=s=>"("+sg(s[0])+", "+sg(s[1])+")";
function eqText(){
  const l=L[S.lv];
  if(!S.mode)return l.s?"Laser at "+pos(l.s):l.h;
  if(S.mode=="v")return "x = "+sg(S.k);
  if(S.mode=="h"||r(S.m)==0)return "y = "+sg(S.c);
  const m=r(S.m),c=r(S.c);
  return "y = "+(m==1?"x":m==-1?"−x":sg(m)+"x")+(c==0?"":(c<0?" − ":" + ")+Math.abs(c));
}
function say(t,bad){const e=$("msg");e.textContent=t;e.className="msg"+(bad?" bad":"")}
function load(i){
  S.lv=i;const l=L[i];
  S.E=l.e.map(p=>({x:p[0],y:p[1],alive:true,t:0}));
  S.mode=null;S.shots=0;S.beam=null;S.done=false;$("typed").value="";
  say("Par: "+l.par+(l.par>1?" shots.":" shot.")+" A wrong equation still costs a shot.");ui();
}
function ui(){
  const l=L[S.lv];
  $("lv").textContent="Level "+(S.lv+1)+" of "+L.length+" · shots "+S.shots;
  $("ttl").textContent=l.t;$("desc").textContent=l.d;$("eq").textContent=eqText();
  $("fire").disabled=S.done||!!(S.beam&&!S.beam.fin);
  $("next").disabled=!(S.done&&S.lv<L.length-1);
  $("dots").innerHTML="";
  L.forEach((_,i)=>{const b=document.createElement("button");b.className=(i==S.lv?"cur ":"")+(S.best[i]?"done":"");
    b.innerHTML=(i+1)+"<small>"+(S.best[i]?"★".repeat(S.best[i]):"·")+"</small>";b.onclick=()=>load(i);$("dots").appendChild(b)});
}
const num=s=>s.includes("/")?s.split("/")[0]/s.split("/")[1]:+s;
function parse(s){
  s=s.toLowerCase().replace(/[−–]/g,"-").replace(/\s+/g,"");const N="(-?\\d*\\.?\\d+(?:/\\d+)?)";let a;
  if(a=s.match(new RegExp("^x="+N+"$")))return{v:num(a[1])};
  if(a=s.match(new RegExp("^y="+N+"$")))return{m:0,c:num(a[1])};
  if(a=s.match(/^y=(-?\d*\.?\d*(?:\/\d+)?)\*?x(?:([+-]\d*\.?\d+(?:\/\d+)?))?$/)){
    const m=a[1]==""?1:a[1]=="-"?-1:num(a[1]);return{m,c:a[2]?num(a[2]):0}}
  return null;
}
const inObs=(x,y)=>L[S.lv].o.some(o=>x>=o[0]&&x<=o[2]&&y>=o[1]&&y<=o[3]);
function path(){
  const st=L[S.lv].s,v=S.mode=="v",m=S.mode=="l"?S.m:0;
  const pt=t=>v?[S.k,t]:[t,m*t+S.c];
  const ok=t=>{const q=pt(t);return Math.abs(q[0])<=10.001&&Math.abs(q[1])<=10.001};
  const walk=(t,d)=>{let s=false;for(let i=0;i<1100;i++){const n=t+d*.02;if(!ok(n))break;const q=pt(n);if(inObs(q[0],q[1])){s=true;break}t=n}return[t,s]};
  const t0=st?(v?st[1]:st[0]):-10;
  if(!ok(t0))return null;
  const lo=st?walk(t0,-1):[t0,false],hi=walk(t0,1);
  return{v,m,c:S.c,o:st?st.slice():pt(t0),lo:lo[0],hi:hi[0],a:pt(lo[0]),b:pt(hi[0]),sl:lo[1],sh:hi[1]};
}
function hits(p){
  const out=[];if(!p)return out;
  S.E.forEach((e,i)=>{if(!e.alive)return;const te=p.v?e.y:e.x;
    const on=p.v?Math.abs(e.x-S.k)<.2:Math.abs(p.m*e.x-e.y+p.c)/Math.hypot(p.m,1)<.2;
    if(on&&te>=p.lo-.05&&te<=p.hi+.05)out.push(i)});
  return out;
}
function fire(){
  if(S.done||(S.beam&&!S.beam.fin))return;
  const p=parse($("typed").value),l=L[S.lv];
  if(!p){say("Type an equation such as y = 2x + 1, y = 3 or x = −2.",1);return}
  const md=p.v!==undefined?"v":p.m===0?"h":"l";
  if(l.ok&&!l.ok.includes(md)){say(l.n,1);return}
  if(l.s){const miss=md=="v"?Math.abs(p.v-l.s[0]):Math.abs(p.m*l.s[0]+p.c-l.s[1]);
    if(miss>.05){say("Your line must pass through the laser at "+pos(l.s)+". Check your equation. No shot was used.",1);return}}
  S.mode=md;S.m=p.m||0;S.c=p.c||0;S.k=p.v||0;S.shots++;
  const pa=path();S.beam={p:pa,t0:performance.now(),hit:hits(pa),fin:false};ui();
}
function finish(now){
  const b=S.beam;b.fin=true;b.hit.forEach(i=>{S.E[i].alive=false;S.E[i].t=now});
  const left=S.E.filter(e=>e.alive).length,par=L[S.lv].par;
  let t=!b.p?"The beam never entered the grid.":b.hit.length?"Destroyed "+b.hit.length+(b.hit.length>1?" enemies.":" enemy."):"No enemy on that line.";
  if(b.p&&(b.p.sl||b.p.sh))t+=" Part of the beam was blocked by an obstacle.";
  if(!left){S.done=true;const st=S.shots<=par?3:S.shots<=par+1?2:1;S.best[S.lv]=Math.max(S.best[S.lv]||0,st);
    t="Level cleared in "+S.shots+(S.shots>1?" shots ":" shot ")+"★".repeat(st)+(S.lv==L.length-1?" Mission complete.":"")}
  else t+=" "+left+" remaining.";
  say(t,!b.hit.length&&!S.done);ui();
}
$("fire").onclick=fire;$("reset").onclick=()=>load(S.lv);$("next").onclick=()=>load(S.lv+1);
$("typed").onkeydown=e=>{if(e.key=="Enter")fire()};

function size(){dpr=window.devicePixelRatio||1;cv.width=cv.height=Math.round(cv.clientWidth*dpr);U=cv.width/20}
window.addEventListener("resize",size);
const X=x=>(x+10)*U,Y=y=>(10-y)*U;
function draw(now){
  const W=cv.width,l=L[S.lv];ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,W,W);ctx.lineWidth=dpr;
  for(let i=0;i<=20;i++){const v=i-10;ctx.strokeStyle=v==0?"rgba(255,255,255,.4)":"rgba(255,255,255,.07)";
    ctx.beginPath();ctx.moveTo(X(v),0);ctx.lineTo(X(v),W);ctx.moveTo(0,Y(v));ctx.lineTo(W,Y(v));ctx.stroke()}
  ctx.fillStyle="rgba(255,255,255,.5)";
  for(let i=0;i<=20;i++)for(let j=0;j<=20;j++){ctx.beginPath();ctx.arc(i*U,j*U,1.2*dpr,0,7);ctx.fill()}
  ctx.font=10*dpr+"px 'IBM Plex Mono',monospace";ctx.fillStyle="rgba(255,255,255,.4)";
  for(let v=-8;v<=8;v+=2){if(!v)continue;ctx.fillText(sg(v),X(v)-4*dpr,Y(0)+13*dpr);ctx.fillText(sg(v),X(0)+5*dpr,Y(v)+3*dpr)}
  ctx.fillText("x",W-14*dpr,Y(0)-6*dpr);ctx.fillText("y",X(0)+6*dpr,12*dpr);
  l.o.forEach(o=>{const x=X(o[0]),y=Y(o[3]),w=(o[2]-o[0])*U,h=(o[3]-o[1])*U;
    ctx.fillStyle="rgba(255,255,255,.06)";ctx.fillRect(x,y,w,h);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    ctx.strokeStyle="rgba(255,255,255,.2)";for(let i=-h;i<w;i+=9*dpr){ctx.beginPath();ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);ctx.stroke()}
    ctx.restore();ctx.strokeStyle="rgba(255,255,255,.6)";ctx.strokeRect(x,y,w,h)});
  const b=S.beam;
  if(b&&b.p){const prog=Math.min(1,(now-b.t0)/650),o=b.p.o;if(prog>=1&&!b.fin)finish(now);
    [[b.p.a,b.p.sl],[b.p.b,b.p.sh]].forEach(([e,bl])=>{
      ctx.save();ctx.shadowColor="#fff";ctx.shadowBlur=14*dpr;ctx.strokeStyle="#fff";ctx.lineWidth=2.2*dpr;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(X(o[0]),Y(o[1]));ctx.lineTo(X(o[0]+(e[0]-o[0])*prog),Y(o[1]+(e[1]-o[1])*prog));ctx.stroke();ctx.restore();
      if(prog>=1&&bl){ctx.strokeStyle="#c9604f";ctx.lineWidth=2*dpr;const s=.3*U,cx=X(e[0]),cy=Y(e[1]);
        ctx.beginPath();ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s,cy+s);ctx.moveTo(cx+s,cy-s);ctx.lineTo(cx-s,cy+s);ctx.stroke()}})}
  else if(b&&!b.p&&!b.fin&&now-b.t0>650)finish(now);
  if(l.s){const cx=X(l.s[0]),cy=Y(l.s[1]);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,.22*U,0,7);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(cx,cy,.45*U,0,7);ctx.stroke();
    ctx.fillStyle="#fff";ctx.fillText("LASER "+pos(l.s),cx+.6*U,cy+.9*U)}
  S.E.forEach((e,i)=>{const cx=X(e.x),cy=Y(e.y);
    if(e.alive){const s=.4*U*(1+.08*Math.sin(now/300+i));
      ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s,cy);ctx.closePath();
      ctx.fillStyle="rgba(10,10,10,.9)";ctx.fill();ctx.strokeStyle="#f2f2f2";ctx.lineWidth=1.5*dpr;ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,.55)";ctx.fillText(pos([e.x,e.y]),cx+.55*U,cy-.45*U)}
    else{const age=(now-e.t)/700;ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.arc(cx,cy,3*dpr,0,7);ctx.fill();
      if(age<1){ctx.strokeStyle="rgba(255,255,255,"+(1-age)+")";ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(cx,cy,.4*U*(1+2.5*age),0,7);ctx.stroke()}}});
}
function loop(now){draw(now);requestAnimationFrame(loop)}
size();load(0);requestAnimationFrame(loop);
</script>
</body>
</html>
