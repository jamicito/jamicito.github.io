<script>
/* ===== fractions ===== */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a||1}
function Q(n,d){d=d||1;if(d<0){n=-n;d=-d}var g=gcd(n,d);return {n:n/g,d:d/g}}
function qadd(p,q){return Q(p.n*q.d+q.n*p.d,p.d*q.d)}
function qmul(p,q){return Q(p.n*q.n,p.d*q.d)}
function qz(p){return p.n===0}
function qeq(p,q){return p.n===q.n&&p.d===q.d}
function qval(p){return p.n/p.d}
var MINUS="\u2212";
function ms(s){return String(s).replace(/-/g,MINUS)}
function qs(p){return ms(p.d===1?String(p.n):p.n+"/"+p.d)}

/* ===== equations and inequalities: a·x + b  rel  c·x + d ===== */
var FLIP={"=":"=","<":">",">":"<","≤":"≥","≥":"≤"};
function lin(A,B){ /* integers */
  var s="";
  if(A!==0)s=A===1?"x":A===-1?"−x":ms(A)+"x";
  if(B!==0){if(!s)s=ms(B);else s+=(B<0?" − ":" + ")+Math.abs(B)}
  return s||"0";
}
function side(a,b){
  var D=a.d*b.d/gcd(a.d,b.d);
  var A=a.n*D/a.d,B=b.n*D/b.d;
  if(D===1)return lin(A,B);
  if(qz(b)){ var neg=A<0,t=(Math.abs(A)===1?"x":Math.abs(A)+"x")+"/"+D; return (neg?"−":"")+t }
  if(qz(a))return qs(b);
  return "("+lin(A,B)+")/"+D;
}
function eqText(e){return side(e.a,e.b)+" "+e.rel+" "+side(e.c,e.d)}
function isolated(e){
  return (qeq(e.a,Q(1))&&qz(e.b)&&qz(e.c))||(qeq(e.c,Q(1))&&qz(e.d)&&qz(e.a));
}
function applyOp(e,op){
  var r={a:e.a,b:e.b,c:e.c,d:e.d,rel:e.rel},flipped=false;
  if(op.t==="add"){r.b=qadd(r.b,op.k);r.d=qadd(r.d,op.k)}
  else if(op.t==="addx"){r.a=qadd(r.a,op.k);r.c=qadd(r.c,op.k)}
  else if(op.t==="mul"||op.t==="div"){
    var k=op.t==="mul"?op.k:Q(op.k.d,op.k.n);
    r.a=qmul(r.a,k);r.b=qmul(r.b,k);r.c=qmul(r.c,k);r.d=qmul(r.d,k);
    if(qval(k)<0&&r.rel!=="="){r.rel=FLIP[r.rel];flipped=true}
  }
  else if(op.t==="swap"){r={a:e.c,b:e.d,c:e.a,d:e.b,rel:FLIP[e.rel]}}
  return {e:r,flipped:flipped};
}
function opLabel(op){
  if(op.t==="add")return (qval(op.k)<0?"−":"+")+qs(Q(Math.abs(op.k.n),op.k.d));
  if(op.t==="addx"){var n=Math.abs(op.k.n);return (op.k.n<0?"−":"+")+(n===1?"":n)+"x"}
  if(op.t==="mul")return "×"+(op.k.n<0?"("+qs(op.k)+")":qs(op.k));
  if(op.t==="div")return "÷"+(op.k.n<0?"("+qs(op.k)+")":qs(op.k));
  return "⇄";
}
function opSay(op){
  if(op.t==="add")return (qval(op.k)<0?"Subtract ":"Add ")+qs(Q(Math.abs(op.k.n),op.k.d))+" on both sides";
  if(op.t==="addx"){var n=Math.abs(op.k.n);return (op.k.n<0?"Subtract ":"Add ")+(n===1?"":n)+"x on both sides"}
  if(op.t==="mul")return "Multiply both sides by "+qs(op.k);
  if(op.t==="div")return "Divide both sides by "+qs(op.k);
  return "Swap the two sides";
}
var O={
  add:function(n,d){return {t:"add",k:Q(n,d)}},addx:function(n){return {t:"addx",k:Q(n)}},
  mul:function(n,d){return {t:"mul",k:Q(n,d)}},div:function(n){return {t:"div",k:Q(n)}},swap:function(){return {t:"swap"}}
};
function EQ(a,b,rel,c,d){return {a:a,b:b,c:c,d:d,rel:rel}}

/* ===== levels =====
   #  wall        .  floor       P  start      X  exit
   ?  question brick (collect all to open the exit)
   a–h  operation plates (used once, applied to both sides)
   A, C–G  number pads (sets the number you carry)
   1–3  gates (open only if your number makes the gate true)
   H  Albert’s hint sign      B  patrol bot (moves left and right)
*/
var PARTS=["Concept of an equation","Solving linear equations","Fractional equations","Formulae","Real-world problems","Linear inequalities","Problem solving"];
var LEVELS=[
{name:"Equation or expression?",part:1,ref:"Part 1: Thinking time and Investigation",
 brief:"Collect the question bricks to unlock the exit. They follow Part 1 of your notes in order.",
 hint:"An equation has an ‘=’ sign. A linear equation only has variables with index 1.",
 map:["###############",
      "#P..#....?....#",
      "#.#.#.#####.#.#",
      "#.#...#...#.#.#",
      "#.#####.#.#.#.#",
      "#?..H...#...#.#",

      "###.#.#.#####.#",
      "#?....#......X#",
      "###############"],
 qs:[
  {ref:"Part 1, Thinking time",q:"Which one is an equation?",o:["3x + 2 = 11","3x + 2","x² + 1"],a:0,w:["","No ‘=’ sign, so it’s an expression.","No ‘=’ sign, so it’s an expression."]},
  {ref:"Part 1, Thinking time",q:"In 4 + x = 7, which part is the right-hand side?",o:["7","4 + x","x"],a:0,w:["","That’s on the left of the ‘=’ sign.","x is on the left of the ‘=’ sign."]},
  {ref:"Part 1, Investigation",q:"Which equation is linear?",o:["y = 2x − 9","3x² − 2 = 0","√y = 2x − 9","xy = 1"],a:0,w:["","x² has index 2.","√y means y has index ½.","x times y is not linear."]},
  {ref:"Part 1, Investigation",q:"Which equation is NOT linear?",o:["a/b = b","x/3 = 7","a + 2b + 3c = 0"],a:0,w:["","x/3 is just ⅓ of x. Index 1, so it’s linear.","Every variable here has index 1."]}
 ]},
{name:"Balance moves",part:2,ref:"Part 2: Example 2.1",
 eq:EQ(Q(2),Q(-5),"=",Q(0),Q(5)),eqref:"Example 2.1 (e)",
 ops:{a:O.add(5),b:O.div(2),c:O.add(-5),d:O.mul(2)},
 brief:"You carry Example 2.1 (e). Stepping on a teal plate does that move to <b>both sides</b>, and each plate works once. Reach the exit with x on its own.",
 hint:"Undo the − 5 before you divide. Press R to restart if you get stuck.",
 map:["###############",
      "#P....#...c...#",
      "#.###.#.#####.#",
      "#.#H..b.......#",
      "#.#####.#####.#",
      "#.....#.#...#.#",
      "#####.#.#.#.#.#",
      "#...a.#...#?#.#",
      "#.#####.###.#.#",
      "#.......d....X#",
      "###############"],
 qs:[{ref:"Part 2, Example 2.1 (d)",q:"Solve 2x/7 = 3.",o:["x = 10.5","x = 6/7","x = 21"],a:0,w:["","That’s 3 × 2/7. Divide by 2/7 instead.","That’s 2x. Divide by 2 as well."]}]},
{name:"Both sides",part:2,ref:"Part 2: Examples 2.2 and 2.3",
 eq:EQ(Q(3),Q(4),"=",Q(1),Q(-10)),eqref:"Example 2.2 (a)",
 ops:{a:O.addx(-1),b:O.addx(1),c:O.add(-4),d:O.add(4),e:O.div(2),f:O.div(3)},
 brief:"You carry Example 2.2 (a): x is on both sides. Collect the x terms on one side first.",
 hint:"Subtract x, then subtract 4, then divide by 2.",
 map:["###############",
      "#P..a...#..?..#",
      "#.#####.#.###.#",
      "#.#..b..#.#e..#",
      "#.#.#######.#.#",
      "#...#.c...#.#.#",
      "#.###.###.#.#.#",
      "#.#?..#d..f.#.#",
      "#.#.###.#.##..#",
      "#.....#......X#",
      "###############"],
 qs:[{ref:"Part 2, Example 2.2 (b)",q:"Solve 4x − 2 = x + 7.",o:["x = 3","x = 5/3","x = −3"],a:0,w:["","3x − 2 = 7, so 3x = 9.","Check: 4(−3) − 2 = −14, but −3 + 7 = 4."]},
     {ref:"Part 2, Example 2.3 (a)",q:"Expand 2(x − 3).",o:["2x − 6","2x − 3","x − 6"],a:0,w:["","The 2 multiplies both terms: 2 × 3 = 6.","The 2 multiplies x too."]}]},
{name:"Fraction fix",part:3,ref:"Part 3: Examples 3.1 and 3.2",
 eq:EQ(Q(1,5),Q(-2,5),"=",Q(0),Q(-3)),eqref:"Example 3.1 (a)",
 ops:{a:O.mul(5),b:O.add(2),c:O.add(-2),d:O.mul(2),e:O.div(5)},
 brief:"You carry Example 3.1 (a). Multiply both sides by the LCM of the denominators to clear the fraction.",
 hint:"× 5 first, then + 2.",
 map:["###############",
      "#P.#....?.....#",
      "#..#.####.###.#",
      "#..a....#.#c..#",
      "##.####.#.#.#.#",
      "#......d#...#.#",
      "#.####.####.#.#",
      "#.#?.#....b.#.#",
      "#.#.####.####.#",
      "#......e.....X#",
      "###############"],
 qs:[{ref:"Part 3, Example 3.1 (c)",q:"Solve 8/(2x − 3) = 4.",o:["x = 2½","x = 5/4","x = 1"],a:0,w:["","8 = 4(2x − 3), so 8 = 8x − 12, 8x = 20.","Check: 2(1) − 3 = −1, and 8/(−1) = −8."]},
     {ref:"Part 3, Example 3.2 (b)",q:"To clear the fractions in (3z − 1)/2 = (z − 4)/3, multiply both sides by…",o:["6","5","2"],a:0,w:["","The LCM of 2 and 3 is 6, not 2 + 3.","That only clears the 2."]}]},
{name:"Formula lab",part:4,ref:"Part 4: Examples 4.1 to 4.4",
 brief:"Four formula questions, in the order of Part 4. Patrol bugs send you back to the start if they touch you.",
 hint:"Watch the bugs, then slip past behind them.",
 map:["###############",
      "#P......#....?#",
      "#.#####.#.###.#",
      "#.#?....B.#...#",
      "#.#.#######.#.#",
      "#...#..H..#.#.#",
      "###.#.###.#.#.#",
      "#?..B.....#.#.#",
      "#.#######.#.#.#",
      "#.........#.?X#",
      "###############"],
 qs:[{ref:"Part 4, Example 4.1",q:"F = ma. If m = 1000 kg and a = 0.05 m/s², F = ?",o:["50 N","20 000 N","0.00005 N"],a:0,w:["","That’s 1000 ÷ 0.05. Multiply instead.","That’s 0.05 ÷ 1000. Multiply instead."]},
     {ref:"Part 4, Example 4.2",q:"Area of a semicircle of radius 5 cm (3 s.f.)?",o:["39.3 cm²","78.5 cm²","15.7 cm²"],a:0,w:["","That’s a whole circle. Halve it.","That’s ½π × 5. Square the radius."]},
     {ref:"Part 4, Example 4.3 (b)",q:"t = (v − u)/a. If t = 3, v = 2½ and u = 1⅓, then a = ?",o:["7/18","7/2","7/6"],a:0,w:["","That’s 7/6 × 3. Divide by 3 instead.","That’s v − u. Divide it by t."]},

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var cv=$("cv"),ctx=cv.getContext("2d"),ov=$("ov"),box=$("box"),bb=$("boardbox");
var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
var T=48,P=3,PIX='"Silkscreen","VT323",monospace';
var KEY="brickquest-topic4-v2";
var done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
var G=null,li=0;

/* ---------- fit the board to the space ---------- */
function fitCanvas(){
  if(!G)return;
  var port=matchMedia("(max-width:760px),(max-aspect-ratio:1/1)").matches;
  var w=bb.clientWidth-24,h=port?window.innerHeight*.46:bb.clientHeight-24;if(w<50||h<50)return;
  var s=Math.min(w/cv.width,h/cv.height);
  cv.style.width=Math.floor(cv.width*s)+"px";cv.style.height=Math.floor(cv.height*s)+"px";
}
if(window.ResizeObserver)new ResizeObserver(fitCanvas).observe(bb);
window.addEventListener("resize",fitCanvas);

function partsBar(){
  var cur=LEVELS[li].part;
  $("parts").innerHTML=PARTS.map(function(p,k){
    var n=k+1,rooms=LEVELS.map(function(L,j){return L.part===n?j:-1}).filter(function(j){return j>=0});
    var all=rooms.every(function(j){return done[j]});
    return '<span class="'+(n===cur?'cur':all?'done':'')+'" title="Part '+n+': '+p+'">'+n+'</span>';
  }).join("");
}
function load(n){
  li=n;var L=LEVELS[n],grid=L.map.map(function(r){return r.split("")});
  var H=grid.length,W=grid[0].length,start=null,qn=0,bots=[];
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var c=grid[y][x];
    if(c==="P"){start={x:x,y:y};grid[y][x]="."}
    if(c==="?")qn++;
    if(c==="B"){bots.push({x:x,y:y,dx:1,px:x,py:y});grid[y][x]="."}
  }
  G={L:L,grid:grid,W:W,H:H,start:start,x:start.x,y:start.y,px:start.x,py:start.y,dir:1,
     e:L.eq||null,n:null,got:0,total:qn,moves:0,won:false,modal:false,passed:{},bots:bots};
  cv.width=W*T;cv.height=H*T;fitCanvas();
  $("room").textContent="Room "+(n+1)+" of "+LEVELS.length+": "+L.name;
  $("ref").textContent=L.ref;
  partsBar();
  $("carryCard").style.display=(L.eq||L.gates)?"":"none";
  $("carryH").textContent=L.gates?"Your number":"You carry ("+L.eqref+")";
  $("gateCard").style.display=L.gates?"":"none";
  $("brickCard").style.display=qn?"":"none";
  if(L.gates)$("gates").innerHTML=Object.keys(L.gates).map(function(k){return '<li><b>'+k+'</b><span id="g'+k+'">'+L.gates[k].lab+'</span></li>'}).join("");
  $("last").textContent="";
  hud();say(L.brief.replace(/<[^>]+>/g,""));
  showBrief();
}
function hud(){
  if(G.e){var c=$("carry");c.textContent=eqText(G.e);c.classList.toggle("solved",isolated(G.e))}
  else if(G.L.gates)$("carry").textContent=G.n===null?"No number yet":"x = "+ms(G.n);
  var h="";for(var k=0;k<G.total;k++)h+='<span class="qb'+(k<G.got?' got':'')+'">'+(k+1)+'</span>';
  $("bricks").innerHTML=h;
  if(G.L.gates)Object.keys(G.L.gates).forEach(function(k){var s=$("g"+k);if(s)s.textContent=G.L.gates[k].lab+(G.passed[k]?" ✓":"")});
}
function say(t){$("msg").textContent=t}
function exitOpen(){return G.got>=G.total&&(!G.e||isolated(G.e))}

/* ---------- moving ---------- */
function move(dx,dy){
  if(!G||G.modal||G.won)return;
  if(dx)G.dir=dx;
  var x=G.x+dx,y=G.y+dy,c=G.grid[y][x],L=G.L;
  if(c==="#")return;
  if(L.gates&&L.gates[c]){
    var gt=L.gates[c];
    if(G.n===null){say("Gate "+c+" is locked. Step on a number pad first.");bump();return}
    if(!gt.f(G.n)){say("Gate "+c+" stays shut: x = "+ms(G.n)+" doesn’t make "+gt.lab+" true. Try another pad.");bump();return}
    if(!G.passed[c]){G.passed[c]=1;say("Gate "+c+" opens: x = "+ms(G.n)+" makes "+gt.lab+" true.")}
  }
  if(c==="X"&&!exitOpen()){
    var need=[];if(G.got<G.total)need.push("collect "+(G.total-G.got)+" more question brick"+(G.total-G.got>1?"s":""));
    if(G.e&&!isolated(G.e))need.push("get x on its own (you have "+eqText(G.e)+")");
    say("The exit is locked. You still need to "+need.join(" and ")+".");bump();return;
  }
  G.x=x;G.y=y;G.moves++;
  if(L.ops&&L.ops[c]){
    var op=L.ops[c],r=applyOp(G.e,op);G.e=r.e;G.grid[y][x]=".";
    $("last").textContent=opSay(op)+(r.flipped?". Negative, so the sign flips!":".");
    say(isolated(G.e)?"x is on its own: "+eqText(G.e)+". Head for the exit!":"Now you have "+eqText(G.e)+".");
  }
  if(L.pads&&L.pads[c]!==undefined){G.n=L.pads[c];say("You now carry x = "+ms(G.n)+".")}
  if(c==="H")say("Albert says: "+L.hint);
  hud();
  if(c==="?")ask(x,y);
  if(c==="X")win();
  checkBots();
}
var shakeT=-1e9;function bump(){shakeT=performance.now()}

/* ---------- question bricks: always the next question in notes order ---------- */
function ask(x,y){
  var q=G.L.qs[G.got];G.modal=true;
  box.innerHTML='<h2>Question '+(G.got+1)+' of '+G.total+'</h2><div class="tag">Notes: '+q.ref+'</div><p>'+q.q+'</p><div class="opts">'+
    q.o.map(function(o,k){return '<button data-k="'+k+'">'+(k+1)+'. '+o+'</button>'}).join("")+
    '</div><div class="fb" id="fb" role="status"></div><div class="row"><button id="later">Not now</button></div>';
  ov.classList.add("on");box.querySelector(".opts button").focus();
  box.querySelectorAll(".opts button").forEach(function(b){b.onclick=function(){
    var k=+b.dataset.k,fb=$("fb");
    if(k===q.a){
      box.querySelectorAll(".opts button").forEach(function(z){z.disabled=true});b.classList.add("right");
      fb.textContent="✓ Correct! Brick collected.";G.grid[y][x]=".";G.got++;hud();
      var l=$("later");l.textContent="Keep going";l.classList.add("go");l.focus();
      say(G.got<G.total?(G.total-G.got)+" question brick"+(G.total-G.got>1?"s":"")+" left. Next: "+G.L.qs[G.got].ref+".":"All question bricks collected!"+(G.e&&!isolated(G.e)?" Now get x on its own.":" The exit is open."));
    } else {b.classList.add("wrong");b.disabled=true;fb.textContent="✗ "+(q.w[k]||"Not quite.")+" Try again."}
  }});
  $("later").onclick=closeModal;
}
function closeModal(){ov.classList.remove("on");G.modal=false;cv.focus()}

/* ---------- overlays ---------- */
function showBrief(){
  G.modal=true;
  box.innerHTML='<h2>Room '+(li+1)+': '+G.L.name+'</h2><div class="tag">Notes: '+G.L.ref+'</div><p>'+G.L.brief+'</p>'+
   (G.e?'<p>You start with <b>'+eqText(G.e)+'</b>.</p>':'')+'<div class="row"><button class="go" id="startRoom">Start room</button></div>';
  ov.classList.add("on");$("startRoom").focus();$("startRoom").onclick=closeModal;
}
function win(){
  G.won=true;done[li]=Math.min(done[li]||1e9,G.moves);save();partsBar();
  var last=li===LEVELS.length-1;
  box.innerHTML='<h2>'+(last?'You escaped the Brickworks!':'Room cleared!')+'</h2><p>'+(G.e?'Final answer: <b>'+eqText(G.e)+'</b>. ':'')+G.moves+' moves.</p>'+
   (last?'<p>All seven parts of Topic 4 done.</p>':'<p>Next: '+LEVELS[li+1].ref+'.</p>')+
   '<div class="row">'+(last?'':'<button class="go" id="nextRoom">Next room</button>')+'<button id="again">Play again</button><button id="toRooms">Rooms</button></div>';
  G.modal=true;ov.classList.add("on");
  if(!last){$("nextRoom").onclick=function(){load(li+1)};$("nextRoom").focus()}
  $("again").onclick=function(){load(li)};$("toRooms").onclick=rooms;
}
function rooms(){
  if(G)G.modal=true;
  box.innerHTML='<h2>Brick Quest</h2><p>Cheryl is locked in the Algebra Brickworks. Nine rooms follow Parts 1 to 7 of your Topic 4 notes. Move with the arrow keys, WASD, the arrow buttons or a swipe.</p><div class="levels">'+
   LEVELS.map(function(L,k){return '<button data-l="'+k+'" class="'+(done[k]?'done':'')+'"><b>Part '+L.part+(done[k]?' ✓':'')+'</b>'+(k+1)+'. '+L.name+'</button>'}).join("")+
   '</div>'+(G?'<div class="row"><button id="back">Back to room '+(li+1)+'</button></div>':'');
  ov.classList.add("on");
  box.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){load(+b.dataset.l)}});
  var bk=$("back");if(bk)bk.onclick=closeModal;
  box.querySelector("[data-l]").focus();
}

/* ---------- patrol bugs ---------- */
function stepBots(){
  if(!G||G.modal||G.won||!G.bots.length)return;
  G.bots.forEach(function(b){
    var free=function(x){return G.grid[b.y][x]==="."};
    if(!free(b.x+b.dx))b.dx=-b.dx;
    if(free(b.x+b.dx))b.x+=b.dx;
  });
  checkBots();
}
function checkBots(){
  for(var k=0;k<G.bots.length;k++){var b=G.bots[k];if(b.x===G.x&&b.y===G.y){
    G.x=G.start.x;G.y=G.start.y;G.px=G.x;G.py=G.y;say("A patrol bug sent you back to the start. Your bricks and equation are safe.");bump();return}}
}
setInterval(stepBots,520);

/* ---------- pixel art ---------- */
function p(X,Y,x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(X+x*P,Y+y*P,w*P,h*P)}
function hash(x,y,k){return ((x*73856093)^(y*19349663)^(k*83492791))>>>0}
function txt(t,x,y,size,col){ctx.font=size+"px "+PIX;ctx.fillStyle=col;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t,x,y)}
function fitTxt(t,max,start){var s=start;ctx.font=s+"px "+PIX;while(ctx.measureText(t).width>max&&s>8){s--;ctx.font=s+"px "+PIX}return s}
function floorT(X,Y,x,y){
  p(X,Y,0,0,16,16,"#c9ccd1");p(X,Y,15,0,1,16,"#a9adb3");p(X,Y,0,15,16,1,"#a9adb3");p(X,Y,0,0,15,1,"#dcdfe3");
  for(var k=0;k<3;k++){var h=hash(x,y,k);p(X,Y,1+h%13,1+(h>>5)%13,1,1,"#b8bcc2")}
}
function waterT(X,Y,x,y,t){
  p(X,Y,0,0,16,16,"#1f6fb8");p(X,Y,0,0,16,1,"#2f86d6");p(X,Y,0,15,16,1,"#17558e");
  var o=RM?0:Math.floor(t/260+x*2+y)%4;
  for(var r=0;r<3;r++){var yy=3+r*5,xx=(r*5+o+x)%11;p(X,Y,xx,yy,3,1,"#9fd4ff");p(X,Y,xx+3,yy-1,2,1,"#9fd4ff")}
}
function wallT(X,Y,x,y,edge,t){
  if(!edge&&hash(x,y,7)%3===0){waterT(X,Y,x,y,t);return}
  var m=edge?"#3a3d42":"#4a4e54",hi=edge?"#585c63":"#6a6f76",lo=edge?"#1f2124":"#2a2c30";
  p(X,Y,0,0,16,16,m);p(X,Y,0,0,16,1,hi);p(X,Y,0,0,1,16,hi);p(X,Y,0,15,16,1,lo);p(X,Y,15,0,1,16,lo);
  p(X,Y,1,7,14,1,lo);p(X,Y,1,8,14,1,hi);
  var o=(y%2)?4:10;p(X,Y,o,1,1,6,lo);p(X,Y,(o+8)%16||2,9,1,6,lo);
}
function qT(X,Y,t){
  p(X,Y,1,1,14,14,"#c2399b");p(X,Y,1,1,14,2,"#f07ad0");p(X,Y,1,1,2,14,"#f07ad0");p(X,Y,1,13,14,2,"#6d1554");p(X,Y,13,1,2,14,"#6d1554");
  var bob=RM?0:Math.round(Math.sin(t/300))*P;
  txt("?",X+T/2,Y+T/2+2+bob*0,26,"#fff");
}
function opT(X,Y,lab){
  p(X,Y,1,2,14,13,"#0c5a56");p(X,Y,1,1,14,13,"#14857f");p(X,Y,1,1,14,1,"#3cc2b8");p(X,Y,1,1,1,13,"#3cc2b8");
  txt(lab,X+T/2,Y+T/2,fitTxt(lab,T-12,14),"#fff");
}
function padT(X,Y,v){
  p(X,Y,2,2,12,12,"#1d1636");p(X,Y,3,3,10,10,"#f3eedc");p(X,Y,3,3,10,1,"#fff");
  var s=ms(v);txt(s,X+T/2,Y+T/2+1,fitTxt(s,T-18,15),"#1d1636");
}
function gateT(X,Y,id,open){
  p(X,Y,0,0,16,16,"#7a3c08");p(X,Y,1,1,14,14,open?"#c9ccd1":"#3a1d06");
  if(!open){for(var i=0;i<4;i++)p(X,Y,2+i*4,1,2,14,"#e07b1f");p(X,Y,1,4,14,2,"#e07b1f");p(X,Y,1,11,14,2,"#e07b1f")}
  p(X,Y,5,5,6,6,open?"#e07b1f":"#1d1636");txt(id,X+T/2,Y+T/2+1,12,open?"#1d1636":"#ffcf4a");
}
function hintT(X,Y){
  p(X,Y,4,2,8,9,"#f6c690");p(X,Y,4,2,8,1,"#e2ad74");
  p(X,Y,4,5,3,2,"#1d1636");p(X,Y,9,5,3,2,"#1d1636");p(X,Y,5,5,1,1,"#9fd8ff");p(X,Y,10,5,1,1,"#9fd8ff");p(X,Y,7,5,2,1,"#1d1636");
  p(X,Y,6,9,4,1,"#8a3b2a");p(X,Y,5,11,6,4,"#2b6ad8");p(X,Y,7,11,2,2,"#fff");
}
function exitT(X,Y,open,t){
  if(!open){p(X,Y,1,1,14,15,"#1f4d2b");p(X,Y,3,3,10,12,"#0f2a17");p(X,Y,7,6,2,2,"#7ee08a");p(X,Y,7,8,2,3,"#7ee08a");return}
  var cols=["#b8f5c0","#5fd377","#2e9e4a","#166b2e"],o=RM?0:Math.floor(t/140);
  for(var r=0;r<4;r++){p(X,Y,1+r*2,1+r*2,14-r*4,14-r*4,cols[(r+o)%4])}
  p(X,Y,7,7,2,2,"#fff");
}
function bug(X,Y,dx){
  p(X,Y,4,5,8,8,"#c8261c");p(X,Y,5,4,6,1,"#c8261c");p(X,Y,7,5,2,8,"#6e0e09");
  p(X,Y,dx>0?11:3,7,2,3,"#1d1636");p(X,Y,2,6,2,1,"#1d1636");p(X,Y,12,6,2,1,"#1d1636");p(X,Y,2,10,2,1,"#1d1636");p(X,Y,12,10,2,1,"#1d1636");
  p(X,Y,5,6,1,1,"#fff");p(X,Y,10,6,1,1,"#fff");
}
function cheryl(X,Y,dir,t,moving){
  var b=moving&&!RM?((Math.floor(t/120)%2)?-1:0):0;Y+=b*P;
  p(X,Y,3,1,10,11,"#6b3a1e");p(X,Y,4,3,8,6,"#f6c690");p(X,Y,3,2,10,1,"#2ec4c4");
  p(X,Y,4,4,3,1,"#1d1636");p(X,Y,9,4,3,1,"#1d1636");p(X,Y,7,5,2,1,"#1d1636");
  p(X,Y,dir>0?6:5,5,1,1,"#1d1636");p(X,Y,dir>0?11:10,5,1,1,"#1d1636");
  p(X,Y,7,7,2,1,"#a33a2a");
  p(X,Y,4,9,8,4,"#d23a2a");p(X,Y,7,9,2,2,"#fff");p(X,Y,3,10,1,3,"#f6c690");p(X,Y,12,10,1,3,"#f6c690");
  p(X,Y,5,13,6,2,"#2b4fb5");p(X,Y,5,15,2,1,"#1d1636");p(X,Y,9,15,2,1,"#1d1636");
}
function draw(now){
  if(G){
    var L=G.L,open=exitOpen(),k=RM?1:.35;
    var moving=Math.abs(G.x-G.px)+Math.abs(G.y-G.py)>.05;
    G.px+=(G.x-G.px)*k;G.py+=(G.y-G.py)*k;
    G.bots.forEach(function(b){b.px+=(b.x-b.px)*(RM?1:.25);b.py+=(b.y-b.py)*(RM?1:.25)});
    var sh=(now-shakeT<200&&!RM)?(Math.floor(now/40)%2?P:-P):0;
    ctx.save();ctx.translate(sh,0);
    for(var y=0;y<G.H;y++)for(var x=0;x<G.W;x++){
      var c=G.grid[y][x],X=x*T,Y=y*T;
      if(c==="#"){wallT(X,Y,x,y,x===0||y===0||x===G.W-1||y===G.H-1,now);continue}
      floorT(X,Y,x,y);
      if(c==="?")qT(X,Y,now);
      else if(L.ops&&L.ops[c])opT(X,Y,opLabel(L.ops[c]));
      else if(L.pads&&L.pads[c]!==undefined)padT(X,Y,L.pads[c]);
      else if(L.gates&&L.gates[c])gateT(X,Y,c,!!G.passed[c]);
      else if(c==="H")hintT(X,Y);
      else if(c==="X")exitT(X,Y,open,now);
    }
    G.bots.forEach(function(b){bug(Math.round(b.px*16)*P,Math.round(b.py*16)*P,b.dx)});
    cheryl(Math.round(G.px*16)*P,Math.round(G.py*16)*P,G.dir,now,moving);
    ctx.restore();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- input ---------- */
var lastMove=0;
document.addEventListener("keydown",function(e){
  if(ov.classList.contains("on")){
    if(e.key==="Escape"&&G&&!G.won&&box.querySelector("#later"))closeModal();
    var n=parseInt(e.key,10);if(n>=1&&n<=4){var b=box.querySelector('.opts button[data-k="'+(n-1)+'"]');if(b&&!b.disabled)b.click()}
    return;
  }
  var d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[e.key];
  if(d){e.preventDefault();var t=performance.now();if(t-lastMove<95)return;lastMove=t;move(d[0],d[1]);return}
  if(e.key==="r"||e.key==="R")load(li);
  if((e.key==="h"||e.key==="H")&&G)say("Albert says: "+G.L.hint);
});
document.querySelectorAll(".dpad button").forEach(function(b){
  var d=b.dataset.d.split(",").map(Number),rep=null;
  function go(){move(d[0],d[1])}
  b.addEventListener("pointerdown",function(e){e.preventDefault();go();clearInterval(rep);rep=setInterval(go,170)});
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){b.addEventListener(ev,function(){clearInterval(rep)})});
});
var sx=0,sy=0;
cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY});
cv.addEventListener("pointerup",function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1)});
$("bLevels").onclick=rooms;$("bRestart").onclick=function(){load(li)};$("bHint").onclick=function(){if(G)say("Albert says: "+G.L.hint)};
cv.tabIndex=0;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitCanvas);

load(0);rooms();
})();

</script>
