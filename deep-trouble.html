<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Trouble: The Mine at −640 m</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Semi+Condensed:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Underground: the game is dark by design in light and dark mode */
:root{--fg:#F5EBDA;--dim:#B9AB93;--amber:#FFB547;--green:#6BE38A;--red:#FF6B5B;--cyan:#7FD6FF;--yel:#FFE066;--pink:#E59BFF;--glass:rgba(18,12,7,.74);--edge:rgba(255,190,110,.28);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#F5EBDA}}
:root[data-theme="dark"]{--fg:#F5EBDA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0B0805;color:var(--fg);font:500 16px/1.3 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.bgimg{position:fixed;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.45) saturate(1.1);z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex}
.stage{position:relative;height:100%;aspect-ratio:720/880;max-width:62vw;flex:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;gap:10px;padding:14px 16px 14px 6px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:10px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:"Saira Stencil One",Impact,sans-serif;font-size:30px;line-height:1;color:var(--amber);letter-spacing:1px}
.dayb{text-align:right;line-height:1.05}
.dayb b{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:28px;color:var(--yel)}
.dayb small{display:block;color:var(--dim);font-size:13px}
.big{display:flex;gap:16px;align-items:baseline;margin-top:6px}
.big .v{font-family:"Saira Stencil One",Impact,sans-serif;font-size:34px;line-height:1}
.big .l{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:3px;min-width:0}
.st .t{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.st .t svg{width:16px;height:16px;flex:none}
.st .n{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .6s}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{display:grid;grid-template-columns:34px 1fr;gap:0 10px;align-items:center;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:12px;color:var(--fg);font:inherit;padding:9px 10px;cursor:pointer;min-height:56px}
.act:hover,.act:focus-visible{border-color:var(--amber);background:rgba(255,181,71,.13);outline:none}
.act:disabled{opacity:.35;cursor:default}
.act svg{width:30px;height:30px;grid-row:span 2;color:var(--amber)}
.act .n{font-weight:800;font-size:17px}
.act .n kbd{font:600 12px/1 "Barlow Semi Condensed",sans-serif;border:1px solid var(--dim);border-radius:4px;padding:1px 4px;margin-left:4px;color:var(--dim)}
.act .d{font-size:13px;color:var(--dim)}
.log{flex:1;min-height:0;overflow:hidden;font-size:15px}
.log .lh{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.log div.e{margin:3px 0}
.hint{font-size:12px;color:var(--dim)}
.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--yel)}.c{color:var(--cyan)}.a{color:var(--amber)}.dm{color:var(--dim)}
/* survivors */
.crew{transition:transform 1.4s cubic-bezier(.4,.1,.2,1)}
.pop{animation:pop 2.2s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal{background:rgba(22,15,9,.96);border:1px solid var(--amber);border-radius:16px;max-width:560px;width:100%;padding:18px 20px;max-height:92%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal .mt{font-family:"Saira Stencil One",Impact,sans-serif;color:var(--amber);font-size:24px;margin-bottom:4px}
.modal p{margin:8px 0}
.q{font-size:22px;font-weight:700;background:rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input.ans{font:700 22px "Barlow Semi Condensed",sans-serif;background:#000;color:var(--yel);border:2px solid var(--amber);border-radius:10px;padding:6px 12px;width:200px}
.btn{font:700 17px "Barlow Semi Condensed",sans-serif;background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--edge);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--amber);outline:none}
.btn.big{background:var(--amber);color:#1A1006;border-color:var(--amber)}
.btn.big:hover,.btn.big:focus-visible{filter:brightness(1.1);outline:2px solid #fff;outline-offset:2px}
.opt{min-width:110px}
.opt.right{border-color:var(--green);color:var(--green)}.opt.wrong{border-color:var(--red);color:var(--red)}
.fb{margin-top:10px;padding:10px 12px;border-left:4px solid var(--edge);background:rgba(255,255,255,.04);border-radius:6px}
.hide{display:none!important}
/* PORTRAIT: picture fills the screen, controls float on top and bottom */
@media (max-aspect-ratio:1/1){
 .stage{position:absolute;inset:0;max-width:none;aspect-ratio:auto;width:100%}
 .side{position:absolute;inset:0;padding:10px;pointer-events:none;gap:8px}
 .side>*{pointer-events:auto}
 .spacer{flex:1;pointer-events:none!important}
 .logo{font-size:24px}
 .big{margin-top:2px}.big .v{font-size:26px}
 .stats{gap:6px}.st .t{font-size:11px}.st .n{font-size:16px}
 .log{flex:none;max-height:64px;font-size:14px}
 .log .lh{display:none}
 .acts{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
 .act{grid-template-columns:1fr;justify-items:center;text-align:center;padding:7px 2px;min-height:58px}
 .act svg{grid-row:auto;width:24px;height:24px}
 .act .n{font-size:13px}.act .n kbd,.act .d,.hint{display:none}
 .card{padding:8px 10px}
}
@media (min-aspect-ratio:1/1){.spacer{display:none}.order-acts{order:3}.order-log{order:4}}
@media (prefers-reduced-motion:reduce){.crew{transition:none}.pop{animation:none;opacity:0}}
</style></head><body>

 </svg></div>
 <div class="side">

   <div class="big"><div><div class="v a" id="depth">−640 m</div><div class="l">crew depth</div></div><div><div class="v c" id="drill">0 m</div><div class="l">rescue drill</div></div></div>

  <div class="card"><div class="stats" id="stats"></div></div>

 </div>
</div>

const PATH=[[422,418],[600,515],[390,522],[600,638],[395,632],[600,755],[400,735],[598,865],[405,838],[598,975],[410,930],[680,1095],[730,1112]];
const SEG=[];let TOT=0;for(let i=1;i<PATH.length;i++){const d=Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]);SEG.push(d);TOT+=d}
function pointAt(f){f=Math.max(0,Math.min(1,f));let t=f*TOT;for(let i=0;i<SEG.length;i++){if(t<=SEG[i]){const k=t/SEG[i];return[PATH[i][0]+(PATH[i+1][0]-PATH[i][0])*k,PATH[i][1]+(PATH[i+1][1]-PATH[i][1])*k,i]}t-=SEG[i]}return[...PATH[PATH.length-1],SEG.length-1]}

const lvl=()=>Math.min(3,1+Math.floor((S.day-1)/5));
function qInt(){ // integers & depth
 const L=lvl(),t=ri(0,L>=2?5:3);
 if(t===0){const c=ri(18,60),s=ri(3,15);return{q:`You are at ${m(S.depth)} m. You climb ${c} m, then slip back ${s} m. What is your new depth (in m)?`,ans:S.depth+c-s,ex:`${m(S.depth)} + ${c} − ${s} = ${m(S.depth+c-s)}`}}
 if(t===1){const a=ri(5,40),b=ri(5,40);return{q:`${mp(-a)} + ${mp(-b)} = ?`,ans:-a-b,ex:`Two negatives: add the absolute values, keep the sign: ${m(-a-b)}.`}}
 if(t===2){const a=ri(3,30),b=ri(3,30);return{q:`${a} − ${mp(-b)} = ?`,ans:a+b,ex:`Subtracting a negative is adding: ${a} + ${b} = ${a+b}.`}}
 if(t===3){const a=ri(2,12),b=ri(2,12),neg=Math.random()<.5;const A=-a,B=neg?-b:b;return{q:`${mp(A)} × ${mp(B)} = ?`,ans:A*B,ex:`${A*B<0?'Different signs give a negative':'Same signs give a positive'}: ${m(A*B)}.`}}
 if(t===4){const b=ri(2,9),c=ri(2,9),a=ri(5,30);const v=-a+b*(-c);return{q:`${m(-a)} + ${b} × ${mp(-c)} = ?`,ans:v,ex:`Multiply first: ${b} × ${mp(-c)} = ${m(-b*c)}; then ${m(-a)} + ${mp(-b*c)} = ${m(v)}.`}}
 const a=ri(2,6),b=ri(1,20),br=Math.random()<.5;const v=br?a*a-b:-(a*a)-b;
 return{q:`${br?`(${m(-a)})<sup>2</sup>`:`${m(-a)}<sup>2</sup>`} − ${b} = ?`,ans:v,ex:br?`(${m(-a)})² = ${a*a}, so ${a*a} − ${b} = ${m(v)}.`:`${m(-a)}² means −(${a} × ${a}) = ${m(-a*a)}, so ${m(-a*a)} − ${b} = ${m(v)}.`};
}
function roundSF(x,n){if(x===0)return 0;const d=Math.ceil(Math.log10(Math.abs(x)));const p=n-d;const f=Math.pow(10,p);return Math.round(x*f)/f}
function fmt(x){return(+x.toPrecision(12)).toString().replace('-','−')}
function qRound(){
 const L=lvl(),t=ri(0,L>=2?4:2);
 if(t===0){const x=ri(1000,99999)/[1,10,100][ri(0,2)],n=ri(1,3);const a=roundSF(x,n);return{q:`A supply map says the cache is ${fmt(x)} m away. Round this to ${n} significant figure${n>1?'s':''}.`,ans:a,ex:`${fmt(x)} ≈ ${fmt(a)} (${n} s.f.)`}}
 if(t===1){const x=ri(10000,999999)/10000,n=ri(1,2);const a=Math.round(x*10**n)/10**n;return{q:`The gas meter reads ${fmt(x)}. Round it to ${n} decimal place${n>1?'s':''}.`,ans:a,ex:`${fmt(x)} ≈ ${a.toFixed(n)} (${n} d.p.)`}}
 if(t===2){const a=ri(21,89)/10,b=ri(11,49);const ra=roundSF(a,1),rb=roundSF(b,1);return{q:`Estimate ${a} × ${b} by rounding each number to 1 significant figure.`,ans:ra*rb,ex:`${a} ≈ ${ra}, ${b} ≈ ${rb}, so the estimate is ${ra} × ${rb} = ${ra*rb}.`}}
 if(t===3){const x=pick(['0.0405','30.60','7.0','1002','0.00309','12.000','600.0','0.050']);const map={'0.0405':3,'30.60':4,'7.0':2,'1002':4,'0.00309':3,'12.000':5,'600.0':4,'0.050':2};return{q:`The rock sample weighs ${x} kg. How many significant figures does ${x} have?`,ans:map[x],ex:`Leading zeros don’t count; zeros between digits and trailing zeros after the decimal point do. ${x} has ${map[x]} s.f.`}}
 const a=ri(41,98)*10+ri(1,9),b=ri(11,49)*10+ri(1,9);const est=roundSF(a,1)*roundSF(b,1),act=a*b;
 const opts=shuffle([est,est*10,Math.round(est/10),roundSF(act+est*0.6,2)].map(x=>Math.round(x)));
 return{q:`Which is the best estimate of ${a} × ${b}?`,mc:[...new Set(opts)].map(String),ans:String(Math.round(est)),ex:`${a} × ${b} ≈ ${roundSF(a,1)} × ${roundSF(b,1)} = ${est}. (Actual: ${act}.)`};
}
function qAir(){
 const L=lvl(),t=ri(0,L>=2?3:2);
 if(t===0){const r=ri(2,12),b=ri(2,9),c=ri(1,30);const v=r*(-b)+c;return{q:`Pump pressure = √${r*r} × ${mp(-b)} + ${c}. Work it out.`,ans:v,ex:`√${r*r} = ${r}; ${r} × ${mp(-b)} = ${m(-r*b)}; ${m(-r*b)} + ${c} = ${m(v)}.`}}
 if(t===1){const n=ri(2,6),k=ri(1,15);const v=-n+k;return{q:`Valve setting = ∛(${m(-n*n*n)}) + ${k}. Work it out.`,ans:v,ex:`∛(${m(-n*n*n)}) = ${m(-n)} because (${m(-n)})³ = ${m(-n*n*n)}. So ${m(-n)} + ${k} = ${m(v)}.`}}
 if(t===2){const k=ri(2,5);const v=Math.pow(-2,k);return{q:`Fan speed code = (−2)<sup>${k}</sup>. Work it out.`,ans:v,ex:`(−2)<sup>${k}</sup> = ${m(v)} (${k%2?'odd power keeps the negative sign':'even power makes it positive'}).`}}
 const a=ri(2,9),b=ri(2,9),c=ri(2,6);const v=-a*(b-c*c);
 return{q:`Seal pressure = ${m(-a)} × (${b} − ${c}<sup>2</sup>). Work it out.`,ans:v,ex:`Brackets first: ${b} − ${c*c} = ${m(b-c*c)}; then ${m(-a)} × ${mp(b-c*c)} = ${m(v)}.`};
}
function qRation(){

}
function qRadio(){
 const t=ri(0,3);
 if(t===0){const irr=pick(['√50','π','√2','∛5','√12']),rat=shuffle(['√49','22/7','0.3̇','−1.6','∛(−8)','√(4/9)']).slice(0,3);return{q:'To unlock the radio, pick the IRRATIONAL number.',mc:shuffle([irr,...rat]),ans:irr,ex:`${irr} cannot be written as a ratio of two integers. The others can, e.g. √49 = 7, 22/7, 0.3̇ = 1/3.`}}

 const W=ri(52,98)/10;return{q:`The rescue capsule needs a shaft at least as wide as it is. The surface team says the shaft is ${W.toFixed(1)} m wide, correct to 1 decimal place. What is the LARGEST width it could really be (in m)?`,ans:Math.round((W+0.05)*100)/100,ex:`Correct to 0.1 m means within 0.05 m either way, so the upper bound is ${W.toFixed(1)} + 0.05 = ${(W+0.05).toFixed(2)} m.`};
}

 if(f==='water'){const v=ri(20,40);S.water+=v;return`<span class="c">Found a clean water pocket: +${v} L!</span>`}
 if(f==='battery'){const v=ri(20,35);S.battery=Math.min(100,S.battery+v);return`<span class="a">Found spare lamp batteries: +${v}%!</span>`}
 const v=ri(10,18);S.air=Math.min(100,S.air+v);return`<span class="g">Found an old ventilation shaft: air +${v}%!</span>`;
}
const EVENTS=[
 ()=>{S.depth=Math.max(START,S.depth-20);S.health-=8;return'<span class="r">CAVE-IN! You lose 20 m and health −8.</span>'},
 ()=>{S.water+=15;return'<span class="c">Water seeps through the rock: +15 L.</span>'},
 ()=>{S.air-=10;return'<span class="r">A gas pocket leaks: air −10%.</span>'},
 ()=>{S.food+=12;return'<span class="y">Someone finds a forgotten lunchbox stash: +12 rations.</span>'},
 ()=>{S.battery=Math.max(0,S.battery-10);return'<span class="r">A lamp cracks: battery −10%.</span>'},
 ()=>{S.air=Math.min(100,S.air+8);return'<span class="g">A cool draught from above: air +8%.</span>'},
 ()=>{S.health-=12;return'<span class="r">Rock fall! A miner is hurt: health −12.</span>'},
 ()=>S.drill>=300?(S.food+=18,S.water+=24,'<span class="c">The drill team sends supplies down a borehole: +18 rations, +24 L!</span>'):null,
 ()=>{S.health=Math.min(100,S.health+6);return'<span class="g">The crew sings old mining songs. Morale up: health +6.</span>'}
];

/* ================= DAY FLOW ================= */
let cur=null,answered=false;
function choose(i){
 if(S.over)return;const a=ACTS[i];
 if(S.battery<a.bat){say('<span class="r">Not enough lamp battery. It’s too dark to do that.</span>');return render()}
 cur={a,Q:a.gen()};answered=false;showQ();
}
function showQ(){
 const {a,Q}=cur;
 let h=`<div class="mt">DAY ${S.day} · ${a.n.toUpperCase()}</div><div class="q">${Q.q}</div>`;
 if(Q.mc)h+=`<div class="row" id="opts">${Q.mc.map((o,i)=>`<button class="btn opt" data-i="${i}">${i+1}) ${o}</button>`).join('')}</div>`;
 else h+=`<div class="row"><input class="ans" id="ans" inputmode="decimal" autocomplete="off" aria-label="Your answer"><button class="btn big" id="sub">Submit ⏎</button></div><div class="dm" style="font-size:18px;margin-top:4px">Use - for negative numbers.</div>`;
 h+=`<div id="fb"></div>`;
 $('modal').innerHTML=h;$('ov2').classList.remove('hide');
 if(Q.mc)$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>submit(Q.mc[+b.dataset.i],b));
 else{$('sub').onclick=()=>submit($('ans').value);$('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit($('ans').value)}});$('ans').focus()}
}
function parseNum(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/[\s,]/g,'');if(!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)}
function submit(v,btn){
 if(answered)return;const {a,Q}=cur;let ok;
 if(Q.mc)ok=v===Q.ans;else{const n=parseNum(v);if(isNaN(n)){$('fb').innerHTML='<div class="fb r">Type a number, e.g. -24 or 3.5</div>';return}ok=Math.abs(n-Q.ans)<1e-6}
 answered=true;S.qs++;if(ok)S.ok++;
 if(Q.mc)$('opts').querySelectorAll('button').forEach(b=>{const o=Q.mc[+b.dataset.i];b.disabled=true;if(o===Q.ans)b.classList.add('right');else if(b===btn)b.classList.add('wrong')});
 else $('ans').disabled=true,$('sub').disabled=true;
 S.battery=Math.max(0,S.battery-a.bat);
 const res=outcome(a,ok);
 $('fb').innerHTML=`<div class="fb" style="border-color:${ok?'var(--green)':'var(--red)'}"><div class="${ok?'g':'r'}">${ok?'✔ CORRECT!':'✘ NOT QUITE.'} ${ok?'':'Answer: '+(Q.mc?Q.ans:fmt(Q.ans))}</div><div class="dm">${Q.ex}</div><div style="margin-top:6px">${res.join('<br>')}</div></div><div class="row" style="justify-content:flex-end"><button class="btn big" id="nxt">End day ⏎</button></div>`;
 cur.res=res;cur.ok=ok;
 $('nxt').onclick=endDay;$('nxt').focus();
}
function endDay(){
 $('ov2').classList.add('hide');
 const L=[`<span class="a">DAY ${S.day}:</span> ${cur.a.n} — ${cur.ok?'<span class="g">success</span>':'<span class="r">struggled</span>'}. ${cur.res.join(' ')}`];
 // daily use
 const f=S.ration?3:CREW,w=S.ration?6:CREW*2;S.ration=false;
 S.food-=f;S.water-=w;S.air-=6;S.drill=Math.min(-START,S.drill+20);
 if(S.food<0){S.food=0;S.health-=15;L.push('<span class="r">No food left! Health −15.</span>')}
 if(S.water<0){S.water=0;S.health-=20;L.push('<span class="r">No water left! Health −20.</span>')}
 if(Math.random()<.35){for(let i=0;i<5;i++){const e=pick(EVENTS)();if(e){L.push(e);break}}}
 S.health=Math.min(100,S.health);
 S.day++;say(...L);
 checkEnd();render();
}
function checkEnd(){
 let msg=null,win=false;
 if(S.depth>=0){win=true;msg='You reach the surface camp! Blinding sunlight, fresh air, and six very dusty miners.'}
 else if(S.drill>=-S.depth){win=true;msg=`The rescue drill breaks through at ${m(-S.drill)} m! A rescue capsule lifts all six miners out.`}
 else if(S.air<=0){S.air=0;msg='The air ran out.'}
 else if(S.health<=0){S.health=0;msg='The crew is too weak to carry on.'}
 if(!msg)return;S.over=true;
 const acc=S.qs?Math.round(S.ok/S.qs*100):0;
 let best=null;try{best=+localStorage.getItem('deeptrouble-best')||null;if(win&&(!best||S.day-1<best)){localStorage.setItem('deeptrouble-best',S.day-1);best=S.day-1}}catch(e){}
 $('modal').innerHTML=`<div class="mt">${win?'*** RESCUED! ***':'*** GAME OVER ***'}</div><p class="${win?'g':'r'}">${msg}</p>
  <div class="q" style="font-size:22px">Days underground: <span class="y">${S.day-1}</span><br>Deepest point escaped from: <span class="a">${m(S.depth)} m</span><br>Maths problems: <span class="y">${S.ok} / ${S.qs}</span> correct (${acc}%)<br>Supply finds: <span class="y">${S.finds}</span>${best?`<br>Fastest rescue on this device: <span class="g">${best} days</span>`:''}</div>
  <p class="dm">${win?'Try again with a different strategy: dig, search or radio?':'Tip: balance digging with searching for supplies and repairing the air pump.'}</p>
  <div class="row" style="justify-content:center"><button class="btn big" id="again">Play again</button></div>`;
 $('ov2').classList.remove('hide');$('again').onclick=start;$('again').focus();
}
function say(...l){S.log.unshift(...l.reverse());S.log=S.log.slice(0,9)}

/* ================= RENDER ================= */
const ICON={
 air:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/></svg>',
 water:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
 food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V4h8v3M4 12h16"/></svg>',
 lamp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 13a7 7 0 0 1 14 0H5zM12 6V3M4 6l2 2M20 6l-2 2M9 17h6M10 20h4"/></svg>',
 health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>',
 dig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9c4-5 12-5 16 0M12 5l-8 15"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>',
 fan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7s2 5-2 7M14 12c4 0 7 1 7 4s-5 2-7-2M12 14c0 4-1 7-4 7s-2-5 2-7M10 12c-4 0-7-1-7-4s5-2 7 2"/></svg>',
 ration:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 13V8M12 13l4 2M9 3h6"/></svg>',
 radio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="9" width="14" height="12" rx="2"/><path d="M9 9l6-6M9 15h.01M15 15h2"/></svg>'};
const AICON=['dig','search','fan','ration','radio'],SHORT=['Dig','Search','Air','Rations','Radio'];
const CREWC=['#FFD23F','#FF8A3D','#FFD23F','#FF8A3D','#FFD23F','#FF8A3D'];
function miner(x,y,c,i){ // tiny miner with helmet lamp, facing up the tunnel
 return `<g transform="translate(${x} ${y})"><path d="M8 -6 L44 -26 L44 14 Z" fill="#FFE9A6" opacity=".35"/><path d="M0 0 L-7 18 M0 0 L7 18" stroke="#1A1209" stroke-width="5" stroke-linecap="round"/><path d="M0 -20 L0 0" stroke="#1A1209" stroke-width="9" stroke-linecap="round"/><path d="M0 -14 L-10 -2 M0 -14 L10 -6" stroke="#1A1209" stroke-width="4" stroke-linecap="round"/><circle cx="0" cy="-28" r="8" fill="#E7B48A" stroke="#1A1209" stroke-width="2.5"/><path d="M-10 -30 Q0 -44 10 -30 Z" fill="${c}" stroke="#1A1209" stroke-width="2.5"/><circle cx="8" cy="-33" r="3" fill="#FFFBE0"/></g>`;
}
let prevDepth=null;
function render(){
 $('day').textContent=S.day;$('depth').textContent=m(S.depth)+' m';$('drill').textContent=(S.drill?m(-S.drill):'0')+' m';
 const f=S.depth/START;const [px,py,si]=pointAt(f);
 let trail=`${px},${py}`;for(let i=si+1;i<PATH.length;i++)trail+=` ${PATH[i][0]},${PATH[i][1]}`;
 $('trailg').innerHTML=`<polyline points="${trail}" fill="none" stroke="#FFB547" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
 const SURF=470,CX=730,CY=1112,dy=SURF+(CY-SURF)*Math.min(1,S.drill/(-START));
 $('drillg').innerHTML=`<path d="M${CX} ${SURF} V${dy}" stroke="#7FD6FF" stroke-width="9" stroke-dasharray="16 10"/><path d="M${CX-18} ${dy} L${CX} ${dy+30} L${CX+18} ${dy}Z" fill="#7FD6FF" stroke="#0B0805" stroke-width="3"/><text x="${CX+24}" y="${dy+18}" font-family="Barlow Semi Condensed,sans-serif" font-weight="800" font-size="30" fill="#7FD6FF" stroke="#0B0805" stroke-width="6" paint-order="stroke">DRILL</text>`;
 // six survivors spread just behind the leader along the tunnel
 let g='';for(let i=CREW-1;i>=0;i--){const [x,y]=pointAt(f+i*0.012);g+=miner(x-px,y-py,CREWC[i],i)}
 g+=`<text x="16" y="-56" font-family="Saira Stencil One,Impact,sans-serif" font-size="42" fill="#FFE066" stroke="#0B0805" stroke-width="7" paint-order="stroke">${m(S.depth)} m</text>`;
 const cg=$('crewg');cg.innerHTML=g;cg.style.transform=`translate(${px}px,${py}px)`;
 if(prevDepth!==null&&S.depth!==prevDepth){const d=S.depth-prevDepth;$('fx').innerHTML=`<text class="pop" x="${px+40}" y="${py+70}" font-family="Saira Stencil One,Impact,sans-serif" font-size="46" fill="${d>0?'#6BE38A':'#FF6B5B'}" stroke="#0B0805" stroke-width="7" paint-order="stroke">${d>0?'+':'−'}${Math.abs(d)} m</text>`}
 prevDepth=S.depth;
 const st=(k,n,v,max,col,unit)=>`<div class="st"><div class="t" style="color:${col}">${ICON[k]}<span style="color:var(--dim)">${n}</span></div><div class="n">${v}${unit}</div><div class="meter"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%;background:${col}"></i></div></div>`;
 $('stats').innerHTML=st('air','Air',S.air,100,S.air<25?'var(--red)':'var(--green)','%')+st('water','Water',S.water,120,S.water<24?'var(--red)':'var(--cyan)','L')+st('food','Food',S.food,60,S.food<12?'var(--red)':'var(--yel)','')+st('lamp','Lamp',S.battery,100,S.battery<15?'var(--red)':'var(--amber)','%')+st('health','Health',S.health,100,S.health<30?'var(--red)':'var(--pink)','');
 $('acts').innerHTML=ACTS.map((a,i)=>`<button class="act" data-i="${i}" ${S.over||S.battery<a.bat?'disabled':''} aria-label="${a.n}">${ICON[AICON[i]]}<span class="n"><span class="lg">${a.n}</span><kbd>${a.k}</kbd></span><span class="d">${a.d}</span></button>`).join('');
 $('acts').querySelectorAll('.act').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
 const portrait=innerHeight>innerWidth;
 $('acts').querySelectorAll('.lg').forEach((el,i)=>el.textContent=portrait?SHORT[i]:ACTS[i].n);
 $('log').innerHTML=`<div class="lh">Mine log</div>`+S.log.slice(0,portrait?2:6).map(l=>`<div class="e">${l}</div>`).join('');
}
function fitStage(){
 render();const sv=$('stage');
 if(innerHeight>innerWidth){ // portrait: fit the tunnel between the top HUD and the bottom controls
  const cards=document.querySelectorAll('.side .card');const T=cards[1].getBoundingClientRect().bottom+6,B=cards[2].getBoundingClientRect().top-6,W=innerWidth,H=innerHeight;
  const X0=360,X1=800,Y0=390,Y1=1150,k=Math.min(W/(X1-X0),(B-T)/(Y1-Y0));
  const vw=W/k,vh=H/k,vx=(X0+X1)/2-vw/2,vy=Y0-(T+((B-T)-(Y1-Y0)*k)/2)/k;
  sv.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);sv.setAttribute('preserveAspectRatio','xMidYMid meet');
 }else{sv.setAttribute('viewBox','200 330 720 880');sv.setAttribute('preserveAspectRatio','xMidYMid meet')}
}
addEventListener('resize',()=>{if(S)fitStage()});
addEventListener('keydown',e=>{
 if(!$('ov2').classList.contains('hide')){if(cur&&cur.Q&&cur.Q.mc&&!answered){const n=+e.key;if(n>=1&&n<=cur.Q.mc.length)$('opts').querySelectorAll('button')[n-1].click()}return}
 const n=+e.key;if(n>=1&&n<=5)choose(n-1);
});
function start(){
 fresh();prevDepth=null;$('fx').innerHTML='';$('ov2').classList.add('hide');cur=null;
 say('<span class="a">The tunnel collapsed. Six miners are trapped at −640 m.</span>','<span class="dm">Climb to 0 m, or survive until the rescue drill reaches you.</span>');
 fitStage();
 $('modal').innerHTML=`<div class="mt">DEEP TROUBLE</div>
  <p>A collapse has trapped your crew of <b class="y">6 miners</b> <b class="a">640 m below the desert</b> (depth −640 m).</p>
  <p>Each day, pick <b>one action</b>. Every action needs a <b class="y">Topic 2 maths answer</b>: negative numbers, operations, real numbers, rounding and estimation. Correct answers work much better.</p>
  <p>Food, water and air run down every day. <b class="g">Escape</b> by climbing to 0 m, or survive until the <b class="c">rescue drill</b> reaches you.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn big" id="go">Start day 1</button></div>`;
 $('ov2').classList.remove('hide');$('go').onclick=()=>$('ov2').classList.add('hide');$('go').focus();
}
start();
</script></body></html>
